name: Development checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Check project versions
        run: python scripts/check_versions.py

      - name: Check version guard and portable payload
        shell: bash
        run: |
          python -m unittest discover -s scripts -p test_check_versions.py
          python scripts/test_package_layout.py

      - name: Check Linux package boundaries and static ELF validation
        if: runner.os == 'Linux'
        run: python scripts/test_linux_package.py

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
          cache: true

      - name: Set up Rust checks
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup override set stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: checks-${{ matrix.runner }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust format, lint and tests
        run: pnpm check:rust

      - name: Check real management responses against console contracts
        run: pnpm test:contracts

  web:
    name: Console / Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install test browser
        run: pnpm --filter @codex-relay/console exec playwright install --with-deps chromium

      - name: Check console types, build and browser tests
        run: pnpm check:web

      - name: Upload failed browser test evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: console-test-failures
          path: .cache/ui-tests/
          if-no-files-found: ignore
          retention-days: 7
